<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Part 3 — gallery motion studies</title>
    <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --cloud: #f0eee6; --paper: #faf9f5; --ink: #1a1915; --ink-soft: #6f6d64;
        --ink-faint: #9b9890; --clay: #cc785c; --clay-strong: #b1573b; --rule: #e3dfd3;
        --mono: "IBM Plex Mono", ui-monospace, monospace;
        --sans: "Inter", ui-sans-serif, system-ui, sans-serif;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body { display: flex; flex-direction: column; background: var(--cloud); font-family: var(--sans); }
      .tabbar { flex: none; display: flex; align-items: center; gap: 8px; padding: 10px 16px;
        background: var(--paper); border-bottom: 1px solid var(--rule); }
      .label { font-family: var(--mono); font-size: 0.62rem; letter-spacing: 0.12em;
        text-transform: uppercase; color: var(--ink-faint); margin-right: 6px; }
      .tab { display: inline-flex; align-items: baseline; gap: 8px; padding: 6px 14px;
        border: 1px solid var(--rule); border-radius: 999px; background: transparent; color: var(--ink-soft);
        cursor: pointer; font-family: var(--sans); font-size: 0.86rem;
        transition: border-color .14s ease, color .14s ease, background .14s ease; }
      .tab .k { font-family: var(--mono); font-size: 0.58rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--clay-strong); }
      .tab:hover { border-color: var(--clay); color: var(--ink); }
      .tab[aria-selected="true"] { background: var(--ink); color: var(--cloud); border-color: var(--ink); }
      .tab[aria-selected="true"] .k { color: color-mix(in srgb, var(--clay) 65%, white); }
      .spacer { flex: 1; }
      .openlink { font-family: var(--mono); font-size: 0.62rem; letter-spacing: 0.08em;
        text-transform: uppercase; color: var(--ink-faint); text-decoration: none; }
      .openlink:hover { color: var(--clay-strong); }
      .stage { position: relative; flex: 1; min-height: 0; }
      .frame { position: absolute; inset: 0; width: 100%; height: 100%; border: 0;
        opacity: 0; pointer-events: none; transition: opacity .12s ease; }
      .frame.active { opacity: 1; pointer-events: auto; }
    </style>
  </head>
  <body>
    <nav class="tabbar" role="tablist" aria-label="Gallery motion studies">
      <span class="label">Part 3</span>
      <button class="tab" role="tab" data-src="gallery-hybrid.html" aria-selected="true"><span class="k">★</span> Wheel + deck</button>
      <button class="tab" role="tab" data-src="gallery-flywheel.html" aria-selected="false"><span class="k">1</span> Flywheel</button>
      <button class="tab" role="tab" data-src="gallery-stack.html" aria-selected="false"><span class="k">2</span> Card stack</button>
      <button class="tab" role="tab" data-src="gallery-reel.html" aria-selected="false"><span class="k">3</span> 3D reel</button>
      <button class="tab" role="tab" data-src="gallery-ribbon.html" aria-selected="false"><span class="k">4</span> Ribbon</button>
      <span class="spacer"></span>
      <a class="openlink" id="openNew" href="gallery-flywheel.html" target="_blank" rel="noreferrer">Open in new tab ↗</a>
    </nav>
    <div class="stage" id="stage"></div>
    <script>
      (function () {
        var tabs = Array.prototype.slice.call(document.querySelectorAll(".tab"));
        var stage = document.getElementById("stage");
        var openNew = document.getElementById("openNew");
        var frames = {};
        tabs.forEach(function (tab, i) {
          var f = document.createElement("iframe");
          f.className = "frame" + (i === 0 ? " active" : "");
          f.src = tab.dataset.src; f.title = tab.textContent.trim();
          frames[tab.dataset.src] = f; stage.appendChild(f);
        });
        function select(tab) {
          tabs.forEach(function (t) { t.setAttribute("aria-selected", String(t === tab)); });
          Object.keys(frames).forEach(function (src) { frames[src].classList.toggle("active", src === tab.dataset.src); });
          openNew.href = tab.dataset.src;
        }
        tabs.forEach(function (tab) { tab.addEventListener("click", function () { select(tab); }); });
      })();
    </script>
  </body>
</html>
