<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reel — the demo gallery</title>
    <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
    <link
      href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --cloud: #f0eee6; --paper: #faf9f5; --ink: #1a1915; --ink-soft: #6f6d64;
        --ink-faint: #9b9890; --clay: #cc785c; --clay-strong: #b1573b;
        --rule: #e3dfd3; --rule-soft: #ece9df; --ga: #2f6b3a;
        --serif: "Newsreader", Georgia, serif;
        --sans: "Inter", ui-sans-serif, system-ui, sans-serif;
        --mono: "IBM Plex Mono", ui-monospace, monospace;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; }
      body { background: var(--cloud); color: var(--ink); font-family: var(--sans);
        min-height: 100vh; overflow-x: hidden; -webkit-font-smoothing: antialiased; }

      .lab { width: min(1180px, calc(100% - 56px)); margin: 0 auto; padding: clamp(24px, 5vh, 52px) 0 40px; }
      .head { text-align: center; }
      .eyebrow { font-family: var(--mono); font-size: 0.64rem; letter-spacing: 0.22em;
        text-transform: uppercase; color: var(--clay-strong); margin: 0 0 10px; }
      h1 { font-family: var(--serif); font-weight: 500; font-size: clamp(2rem, 4.4vw, 3.1rem);
        line-height: 1.02; letter-spacing: -0.02em; margin: 0 0 8px; }
      h1 em { font-style: italic; color: var(--clay-strong); }
      .sub { margin: 0 auto; color: var(--ink-soft); font-size: 1rem; max-width: 48ch; }

      /* ---- the reel ---- */
      .stage { position: relative; height: clamp(300px, 42vh, 380px); margin: clamp(20px, 4vh, 40px) 0 0;
        perspective: 1500px; touch-action: pan-y; }
      .reel { position: absolute; inset: 0; transform-style: preserve-3d; }
      .cell { display: flex; flex-direction: column; position: absolute; top: 50%; left: 50%; width: 320px;
        transform-origin: center center; will-change: transform, opacity;
        border-radius: 14px; overflow: hidden; background: var(--paper); border: 1px solid var(--rule);
        box-shadow: 0 20px 44px rgba(26,25,21,.16); text-decoration: none; color: inherit;
        transition: transform .5s cubic-bezier(.2,.7,.2,1), opacity .5s ease; }
      .cell-thumb { display: block; position: relative; height: 200px; overflow: hidden; background: var(--rule-soft);
        border-bottom: 1px solid var(--rule-soft); }
      .cell-thumb iframe { --preview-scale: 0.34; }
      .cell-body { display: flex; flex-direction: column; padding: 12px 15px 14px; }
      .cell-k { font-family: var(--mono); font-size: 0.56rem; letter-spacing: 0.12em;
        text-transform: uppercase; color: var(--clay-strong); }
      .cell-h { font-family: var(--serif); font-weight: 500; font-size: 1.1rem; letter-spacing: -0.01em;
        margin: 2px 0 0; line-height: 1.12; }
      .cell .cdot { position: absolute; top: 10px; right: 10px; width: 9px; height: 9px; border-radius: 50%;
        background: var(--ga); box-shadow: 0 0 0 2.5px rgba(47,107,58,.2); z-index: 2; display: none; }
      .cell.has-proof .cdot { display: block; }
      .cell.has-proof.browser .cdot { background: #2f6b6f; box-shadow: 0 0 0 2.5px rgba(47,107,111,.2); }
      /* only the centered cell shows a live preview; the rest are quiet faces */
      .cell:not(.focus) .cell-thumb { background:
        linear-gradient(150deg, var(--rule-soft), #e7e1d4); }
      .cell:not(.focus) .cell-thumb iframe { display: none; }
      .cell.focus { border-color: var(--clay); box-shadow: 0 30px 70px rgba(204,120,92,.24); cursor: default; }

      .caption { text-align: center; margin: clamp(16px, 3vh, 30px) auto 0; max-width: 44ch; min-height: 60px; }
      .cell { border-top: 3px solid var(--cat, var(--rule));
        /* coverflow reflection on the stage floor (graceful no-op where unsupported) */
        -webkit-box-reflect: below 10px linear-gradient(transparent 76%, rgba(26, 25, 21, 0.14)); }
      .cap-cat { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px;
        margin: 0 0 10px; border: 1px solid color-mix(in srgb, var(--cat) 40%, var(--rule));
        background: color-mix(in srgb, var(--cat) 8%, transparent);
        font-family: var(--mono); font-size: 0.54rem; letter-spacing: 0.08em; text-transform: uppercase;
        color: color-mix(in srgb, var(--cat) 70%, var(--ink)); }
      .cap-cat .sw { width: 7px; height: 7px; border-radius: 50%; background: var(--cat); }
      .cap-d { color: var(--ink-soft); font-size: 0.94rem; line-height: 1.45; margin: 0 0 14px; }
      .cap-open { display: inline-flex; align-items: center; gap: 7px; text-decoration: none;
        font-family: var(--mono); font-size: 0.64rem; letter-spacing: 0.1em; text-transform: uppercase;
        color: var(--paper); background: var(--ink); padding: 9px 15px; border-radius: 999px; transition: background .18s ease; }
      .cap-open:hover { background: var(--clay-strong); }

      .controls { display: flex; align-items: center; justify-content: center; gap: 14px; margin-top: 18px;
        flex-wrap: wrap; }
      .rbtn { width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--rule);
        background: var(--paper); color: var(--ink); font-size: 1.05rem; cursor: pointer; line-height: 1;
        transition: border-color .16s ease, color .16s ease; }
      .rbtn:hover { border-color: var(--clay); color: var(--clay-strong); }

      /* the filmstrip rail — dots grouped into coloured audience segments */
      .dots { display: flex; align-items: center; gap: 10px; }
      .rall { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--rule);
        background: var(--paper); cursor: pointer; font-family: var(--serif); font-size: 0.95rem;
        color: var(--clay-strong); line-height: 1; transition: background .16s ease, color .16s ease, border-color .16s ease; }
      .rall.on { background: var(--ink); border-color: var(--ink); color: var(--cloud); }
      .seg { display: inline-flex; align-items: center; gap: 9px; padding: 6px 12px; border-radius: 999px;
        border: 1px solid transparent; transition: border-color .16s ease, background .16s ease; }
      .seg.on { border-color: color-mix(in srgb, var(--cat) 45%, var(--rule));
        background: color-mix(in srgb, var(--cat) 8%, transparent); }
      .seg-l { display: inline-flex; align-items: center; gap: 5px; background: none; border: 0; padding: 0;
        cursor: pointer; font-family: var(--mono); font-size: 0.54rem; letter-spacing: 0.08em;
        text-transform: uppercase; color: color-mix(in srgb, var(--cat) 70%, var(--ink)); }
      .seg-l .sw { width: 7px; height: 7px; border-radius: 50%; background: var(--cat); }
      .seg-d { display: inline-flex; gap: 7px; }
      .pdot { width: 7px; height: 7px; border-radius: 50%;
        border: 1px solid color-mix(in srgb, var(--cat) 60%, var(--ink-faint));
        background: transparent; padding: 0; cursor: pointer; }
      .pdot.on { background: var(--cat); border-color: var(--cat); }

      a:focus-visible, button:focus-visible { outline: 2px solid var(--clay-strong); outline-offset: 3px; border-radius: 8px; }

      @media (max-width: 560px) { .cell { width: 260px; } }
    </style>
  </head>
  <body>
    <main class="lab">
      <div class="head">
        <p class="eyebrow">The demo gallery</p>
        <h1>Spin the reel. <em>Watch it run.</em></h1>
        <p class="sub">Eight products off one verified substrate. The card in focus runs live — drag, scroll, or use the rail below: each coloured segment is an audience, and tapping one cuts the reel to it.</p>
      </div>

      <div class="stage" id="stage" role="group" aria-label="Demo reel">
        <div class="reel" id="reel"></div>
      </div>

      <div class="caption" id="caption"></div>

      <div class="controls">
        <button class="rbtn" id="prev" aria-label="Previous demo">◄</button>
        <div class="dots" id="dots"></div>
        <button class="rbtn" id="next" aria-label="Next demo">►</button>
      </div>
    </main>

    <script src="data.js"></script>
    <script src="switcher.js"></script>
    <script>
      (function () {
        var demos = PROTO.DEMOS;
        var N = demos.length;
        var reel = document.getElementById("reel");
        var caption = document.getElementById("caption");
        var dotsWrap = document.getElementById("dots");
        var focus = 0;

        var catColor = {}, catLabel = {};
        PROTO.AUDIENCES.forEach(function (a) { catColor[a.key] = a.color; catLabel[a.key] = a.label; });

        var cells = demos.map(function (d, i) {
          var proof = /validated/.test(d.badge || "") || d.inBrowser;
          var a = document.createElement("a");
          a.className = "cell" + (proof ? " has-proof" : "") + (d.inBrowser ? " browser" : "");
          a.href = PROTO.DEST[d.id]; a.target = "_blank"; a.rel = "noreferrer";
          a.style.setProperty("--cat", catColor[d.audience] || "var(--rule)");
          a.innerHTML = '<span class="cdot"></span>' + PROTO.preview(d.id, "cell-thumb") +
            '<span class="cell-body"><span class="cell-k">' + d.kicker + '</span>' +
            '<span class="cell-h">' + d.title + '</span></span>';
          a.addEventListener("click", function (e) { if (i !== focus) { e.preventDefault(); go(i); } });
          reel.appendChild(a);
          return a;
        });

        // audience filter — the rail's coloured segments cut the reel to one group
        var filter = null;
        function listFor() {
          return demos.map(function (_, i) { return i; })
            .filter(function (i) { return !filter || demos[i].audience === filter; });
        }

        // filmstrip rail: ∀ (all) + one coloured segment of dots per audience
        var allBtn = document.createElement("button");
        allBtn.className = "rall on"; allBtn.textContent = "∀";
        allBtn.setAttribute("aria-label", "Show all audiences");
        allBtn.addEventListener("click", function () { setFilter(null); });
        dotsWrap.appendChild(allBtn);

        var dots = new Array(N);
        var segs = {};
        PROTO.AUDIENCES.forEach(function (a) {
          var seg = document.createElement("span");
          seg.className = "seg"; seg.style.setProperty("--cat", a.color);
          var lab = document.createElement("button");
          lab.className = "seg-l"; lab.innerHTML = '<span class="sw"></span>' + a.label;
          lab.addEventListener("click", function () { setFilter(filter === a.key ? null : a.key); });
          seg.appendChild(lab);
          var dd = document.createElement("span"); dd.className = "seg-d";
          demos.forEach(function (d, i) {
            if (d.audience !== a.key) return;
            var b = document.createElement("button");
            b.className = "pdot"; b.setAttribute("aria-label", d.kicker);
            b.addEventListener("click", function () {
              // a dot in another segment switches the cut to that segment
              if (filter && d.audience !== filter) { filter = d.audience; syncRail(); }
              go(i);
            });
            dd.appendChild(b); dots[i] = b;
          });
          seg.appendChild(dd);
          dotsWrap.appendChild(seg);
          segs[a.key] = seg;
        });

        function syncRail() {
          allBtn.classList.toggle("on", !filter);
          PROTO.AUDIENCES.forEach(function (a) { segs[a.key].classList.toggle("on", filter === a.key); });
        }
        function setFilter(key) {
          filter = key;
          syncRail();
          var list = listFor();
          if (list.indexOf(focus) === -1) focus = list[0];
          layout();
        }

        function layout() {
          var list = listFor();
          var fpos = list.indexOf(focus);
          for (var i = 0; i < N; i++) {
            var pos = list.indexOf(i);
            if (pos === -1) {
              // filtered out: recede into the fog
              cells[i].style.transform = "translate(-50%,-50%) translateZ(-620px) scale(0.6)";
              cells[i].style.opacity = 0;
              cells[i].style.pointerEvents = "none";
              cells[i].classList.remove("focus");
              dots[i].classList.remove("on");
              continue;
            }
            var off = pos - fpos;
            var abs = Math.abs(off);
            var x = off * 168;
            var z = -abs * 220;
            var ry = off * -38;
            var scale = i === focus ? 1 : 0.82;
            var op = abs > 2 ? 0 : (i === focus ? 1 : 0.62);
            cells[i].style.transform =
              "translate(-50%,-50%) translateX(" + x + "px) translateZ(" + z + "px) rotateY(" + ry + "deg) scale(" + scale + ")";
            cells[i].style.opacity = op;
            cells[i].style.zIndex = String(100 - abs);
            cells[i].style.pointerEvents = abs > 2 ? "none" : "auto";
            cells[i].classList.toggle("focus", i === focus);
            dots[i].classList.toggle("on", i === focus);
          }
          var d = demos[focus];
          caption.style.setProperty("--cat", catColor[d.audience] || "var(--clay)");
          var cat = d.audience
            ? '<span class="cap-cat"><span class="sw"></span>' + catLabel[d.audience] + '</span>'
            : "";
          caption.innerHTML = cat + '<p class="cap-d">' + d.desc + '</p>' +
            '<a class="cap-open" href="' + PROTO.DEST[d.id] + '" target="_blank" rel="noreferrer">Open ' +
            d.kicker + ' ↗</a>';
        }

        function go(i) { focus = ((i % N) + N) % N; layout(); }

        // step within the current cut (wraps)
        function step(dir) {
          var list = listFor();
          var idx = list.indexOf(focus);
          if (idx === -1) idx = 0;
          focus = list[((idx + dir) % list.length + list.length) % list.length];
          layout();
        }

        document.getElementById("next").addEventListener("click", function () { step(1); });
        document.getElementById("prev").addEventListener("click", function () { step(-1); });
        document.addEventListener("keydown", function (e) {
          if (e.key === "ArrowRight") step(1);
          else if (e.key === "ArrowLeft") step(-1);
        });

        // drag to spin
        var stage = document.getElementById("stage");
        var down = false, sx = 0, moved = 0;
        stage.addEventListener("pointerdown", function (e) { down = true; sx = e.clientX; moved = 0; stage.setPointerCapture(e.pointerId); });
        stage.addEventListener("pointermove", function (e) {
          if (!down) return;
          var dx = e.clientX - sx;
          if (Math.abs(dx) > 60) { step(dx < 0 ? 1 : -1); sx = e.clientX; moved += 1; }
        });
        stage.addEventListener("pointerup", function () { down = false; });
        stage.addEventListener("pointercancel", function () { down = false; });

        // scroll to spin — trackpad/wheel over the stage drives the reel
        var wheelLock = 0;
        stage.addEventListener("wheel", function (e) {
          e.preventDefault();
          var now = Date.now();
          if (now - wheelLock < 260) return;
          var d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
          if (Math.abs(d) < 8) return;
          wheelLock = now;
          step(d > 0 ? 1 : -1);
        }, { passive: false });

        layout();
      })();
    </script>
  </body>
</html>
