<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wheel + deck — the demo gallery</title>
    <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
    <link
      href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --cloud: #f0eee6; --paper: #faf9f5; --ink: #1a1915; --ink-soft: #6f6d64;
        --ink-faint: #9b9890; --clay: #cc785c; --clay-strong: #b1573b;
        --rule: #e3dfd3; --rule-soft: #ece9df; --ga: #2f6b3a;
        --serif: "Newsreader", Georgia, serif;
        --sans: "Inter", ui-sans-serif, system-ui, sans-serif;
        --mono: "IBM Plex Mono", ui-monospace, monospace;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; }
      body { background: var(--cloud); color: var(--ink); font-family: var(--sans);
        min-height: 100vh; -webkit-font-smoothing: antialiased; }

      .lab { width: min(1180px, calc(100% - 56px)); margin: 0 auto; padding: clamp(20px, 4vh, 44px) 0 40px; }
      .head { text-align: center; margin-bottom: clamp(14px, 3vh, 30px); }
      .eyebrow { font-family: var(--mono); font-size: 0.64rem; letter-spacing: 0.22em;
        text-transform: uppercase; color: var(--clay-strong); margin: 0 0 10px; }
      h1 { font-family: var(--serif); font-weight: 500; font-size: clamp(2rem, 4.4vw, 3.1rem);
        line-height: 1.02; letter-spacing: -0.02em; margin: 0 0 8px; }
      h1 em { font-style: italic; color: var(--clay-strong); }
      .sub { margin: 0 auto; color: var(--ink-soft); font-size: 1rem; line-height: 1.5; max-width: 56ch; }

      .stagebar { display: grid; grid-template-columns: 400px 1fr; gap: clamp(24px, 4vw, 48px);
        align-items: center; }

      /* ---------- the selector wheel ---------- */
      .selector { position: relative; aspect-ratio: 1; width: 100%; max-width: 400px; justify-self: center; }
      .spokes { position: absolute; inset: 2%; border-radius: 50%;
        border: 1.5px solid var(--rule);
        background: repeating-conic-gradient(from 0deg,
          transparent 0 43deg, color-mix(in srgb, var(--clay) 16%, transparent) 43deg 45deg);
        transition: transform .6s cubic-bezier(.25,.8,.3,1); }
      .spokes::after { content: ""; position: absolute; inset: 12%; border-radius: 50%;
        border: 1px dashed var(--rule); }
      .dial { position: absolute; top: 50%; left: 50%; width: 56%; aspect-ratio: 1;
        transform: translate(-50%, -50%); z-index: 2; overflow: visible; }
      .wedge { cursor: pointer; opacity: 0.55; transform-origin: 50% 50%;
        transition: opacity .18s ease, transform .18s ease; }
      .wedge:hover, .wedge.hl { opacity: 0.9; transform: scale(1.04); }
      .dial.filtered .wedge { opacity: 0.14; }
      .dial.filtered .wedge.on { opacity: 1; transform: scale(1.05); }
      .hub { position: absolute; top: 50%; left: 50%; width: 26%; aspect-ratio: 1; padding: 0;
        transform: translate(-50%, -50%); border-radius: 50%;
        background: radial-gradient(circle at 38% 32%, var(--paper), #efe7db);
        border: 1.5px solid var(--rule); cursor: pointer; display: grid; place-content: center;
        box-shadow: inset 0 2px 8px rgba(26,25,21,.06), 0 6px 16px rgba(26,25,21,.08); z-index: 4;
        transition: border-color .16s ease; }
      .hub:hover { border-color: var(--clay); }
      .hub .mark { font-family: var(--serif); font-weight: 500; font-size: 1.9rem; line-height: 1;
        color: var(--clay-strong); }
      .dial-labels { position: absolute; inset: 0; z-index: 5; pointer-events: none; }
      .dlabel { position: absolute; transform: translate(-50%, -50%); pointer-events: auto; cursor: pointer;
        display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 999px;
        background: var(--cloud); border: 1px solid transparent; white-space: nowrap;
        font-family: var(--mono); font-size: 0.6rem; letter-spacing: 0.08em; text-transform: uppercase;
        color: var(--ink-soft); transition: color .16s ease, border-color .16s ease, background .16s ease; }
      .dlabel .dl-sw { width: 8px; height: 8px; border-radius: 50%; background: var(--dc); flex: none; }
      .dlabel:hover { color: var(--ink); }
      .dlabel.on { color: var(--ink); background: color-mix(in srgb, var(--dc) 9%, var(--cloud));
        border-color: color-mix(in srgb, var(--dc) 45%, var(--rule)); }

      /* ---------- the deck ---------- */
      .deck-wrap { position: relative; height: clamp(400px, 56vh, 500px); perspective: 1400px; min-width: 0; }
      .deck { position: absolute; inset: 0; }

      .leaf { display: flex; flex-direction: column; position: absolute; left: 50%; top: 0; width: min(88%, 400px);
        transform-origin: center bottom; will-change: transform;
        border-radius: 16px; overflow: hidden; background: var(--paper);
        border: 1px solid var(--rule); border-left: 3px solid var(--cat, var(--rule));
        box-shadow: 0 18px 40px rgba(26,25,21,.14);
        text-decoration: none; color: inherit; }
      .leaf-thumb { display: block; position: relative; height: 246px; overflow: hidden; background: var(--rule-soft);
        border-bottom: 1px solid var(--rule-soft); }
      .leaf-thumb iframe { --preview-scale: 0.42; }
      .leaf-body { display: flex; flex-direction: column; gap: 6px; padding: 15px 18px 18px; }
      .leaf-top { display: flex; align-items: center; gap: 10px; margin-bottom: 5px; }
      .leaf-k { font-family: var(--mono); font-size: 0.6rem; letter-spacing: 0.14em;
        text-transform: uppercase; color: var(--clay-strong); }
      .leaf-cat { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 999px;
        border: 1px solid color-mix(in srgb, var(--cat) 40%, var(--rule));
        background: color-mix(in srgb, var(--cat) 8%, transparent);
        font-family: var(--mono); font-size: 0.52rem; letter-spacing: 0.08em; text-transform: uppercase;
        color: color-mix(in srgb, var(--cat) 70%, var(--ink)); }
      .leaf-cat .sw { width: 6px; height: 6px; border-radius: 50%; background: var(--cat); }
      .leaf-badge { margin-left: auto; font-family: var(--mono); font-size: 0.54rem; letter-spacing: 0.08em;
        text-transform: uppercase; color: var(--ink-soft); display: inline-flex; align-items: center; gap: 5px; }
      .leaf-badge .b { width: 6px; height: 6px; border-radius: 50%; background: var(--ga); }
      .leaf-badge.browser .b { background: #2f6b6f; }
      .leaf-h { font-family: var(--serif); font-weight: 500; font-size: 1.4rem; letter-spacing: -0.01em; margin: 0 0 6px; }
      .leaf-d { margin: 0; color: var(--ink-soft); font-size: 0.9rem; line-height: 1.45; }
      .leaf[data-pos]:not([data-pos="0"]) .leaf-body { opacity: 0; }
      .leaf.top { cursor: grab; box-shadow: 0 26px 60px rgba(26,25,21,.20);
        transition: border-color .18s ease, box-shadow .18s ease; }
      .leaf.top:hover { border-color: var(--cat, var(--clay));
        box-shadow: 0 30px 66px color-mix(in srgb, var(--cat, var(--clay)) 26%, rgba(26,25,21,.18)); }
      .leaf.top:active { cursor: grabbing; }
      .leaf.settle { transition: transform .34s cubic-bezier(.2,.7,.2,1), opacity .34s ease; }

      /* fan mode — selected audience pops out into a hand */
      .leaf.fan {
        transform: translate(calc(-50% + var(--fx, 0px)), var(--fy, 0px)) rotate(var(--fr, 0deg));
        transform-origin: center 140%;
        transition: transform .5s cubic-bezier(.2,.75,.25,1.05), box-shadow .25s ease;
        cursor: pointer;
      }
      .leaf.fan:hover {
        transform: translate(calc(-50% + var(--fx, 0px)), calc(var(--fy, 0px) - 26px))
          rotate(var(--fr, 0deg)) scale(1.04);
        box-shadow: 0 32px 64px rgba(26,25,21,.24);
        z-index: 400 !important;
      }
      .leaf.fan .leaf-body { opacity: 1; }
      .leaf.resid { opacity: .4; filter: saturate(.6); pointer-events: none; }

      .controls { display: flex; align-items: center; justify-content: center; gap: 18px; margin-top: 6px; }
      .sbtn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 999px;
        border: 1px solid var(--rule); background: var(--paper); color: var(--ink); cursor: pointer;
        font-family: var(--mono); font-size: 0.64rem; letter-spacing: 0.1em; text-transform: uppercase;
        transition: border-color .16s ease, color .16s ease; }
      .sbtn:hover { border-color: var(--clay); color: var(--clay-strong); }
      .counter { font-family: var(--mono); font-size: 0.72rem; letter-spacing: 0.14em;
        text-transform: uppercase; color: var(--ink-faint); margin: 0; }
      .counter b { color: var(--clay-strong); }
      .hint { margin: 10px 0 0; text-align: center; font-family: var(--mono); font-size: 0.58rem;
        letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-faint); }

      a:focus-visible, button:focus-visible { outline: 2px solid var(--clay-strong); outline-offset: 3px; border-radius: 10px; }
      @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

      @media (max-width: 960px) {
        .stagebar { grid-template-columns: 1fr; gap: 20px; }
        .selector { max-width: 300px; }
        .deck-wrap { height: clamp(380px, 56vh, 470px); }
      }
    </style>
  </head>
  <body>
    <main class="lab">
      <div class="head">
        <p class="eyebrow">The demo gallery</p>
        <h1>Spin to choose. <em>Deal to explore.</em></h1>
        <p class="sub">One engine at the core, split by who it's for. Pick a segment on the wheel and that hand pops out of the deck — or just flip through all eight, card by card.</p>
      </div>

      <div class="stagebar">
        <div class="selector" aria-label="Audience selector">
          <div class="spokes" id="spokes"></div>
          <svg class="dial" id="dial" viewBox="0 0 100 100" aria-hidden="true"></svg>
          <button class="hub" id="hub" aria-label="Show all audiences"><span class="mark">∀</span></button>
          <div class="dial-labels" id="dialLabels"></div>
        </div>

        <div class="deck-wrap">
          <div class="deck" id="deck"></div>
        </div>
      </div>

      <div class="controls">
        <button class="sbtn" id="prev">◄ Back</button>
        <p class="counter"><b id="cn">1</b> / <span id="ct">8</span> · <span id="ck"></span></p>
        <button class="sbtn" id="next">Next ►</button>
      </div>
      <p class="hint">Drag a card to toss it · pick a wheel segment to pull a hand</p>
    </main>

    <script src="data.js"></script>
    <script src="switcher.js"></script>
    <script>
      (function () {
        var demos = PROTO.DEMOS;
        var AUD = PROTO.AUDIENCES;
        var N = demos.length;
        var deck = document.getElementById("deck");
        var VISIBLE = 4;
        var animating = false;
        var spokesEl = document.getElementById("spokes");
        var spokesAngle = 0;

        var catColor = {}, catLabel = {};
        AUD.forEach(function (a) { catColor[a.key] = a.color; catLabel[a.key] = a.label; });

        /* ---------- selector wheel ---------- */
        var SVGNS = "http://www.w3.org/2000/svg";
        var filter = null;
        var dial = document.getElementById("dial");
        var labelBox = document.getElementById("dialLabels");
        var selector = document.querySelector(".selector");
        var wedges = {}, labels = {}, labelMid = {};

        function donut(a0, a1, rO, rI) {
          function pt(a, r) { var t = a * Math.PI / 180; return [50 + r * Math.cos(t), 50 + r * Math.sin(t)]; }
          var large = (a1 - a0) > 180 ? 1 : 0;
          var o0 = pt(a0, rO), o1 = pt(a1, rO), i1 = pt(a1, rI), i0 = pt(a0, rI);
          return "M" + o0[0] + "," + o0[1] + "A" + rO + "," + rO + " 0 " + large + " 1 " + o1[0] + "," + o1[1] +
                 "L" + i1[0] + "," + i1[1] + "A" + rI + "," + rI + " 0 " + large + " 0 " + i0[0] + "," + i0[1] + "Z";
        }

        var SEG = 360 / AUD.length, GAP = 5;
        AUD.forEach(function (a, k) {
          var a0 = -90 + k * SEG, a1 = -90 + (k + 1) * SEG;
          var path = document.createElementNS(SVGNS, "path");
          path.setAttribute("d", donut(a0 + GAP / 2, a1 - GAP / 2, 47, 29));
          path.setAttribute("fill", a.color);
          path.setAttribute("class", "wedge");
          path.addEventListener("click", function () { setFilter(filter === a.key ? null : a.key); });
          dial.appendChild(path);
          wedges[a.key] = path;

          // label = just the name, no counts
          var lab = document.createElement("button");
          lab.className = "dlabel"; lab.style.setProperty("--dc", a.color);
          lab.innerHTML = '<span class="dl-sw"></span>' + a.label;
          lab.addEventListener("click", function () { setFilter(filter === a.key ? null : a.key); });
          labelBox.appendChild(lab);
          labels[a.key] = lab;
          labelMid[a.key] = -90 + (k + 0.5) * SEG;
        });

        function layoutDial() {
          var W = selector.clientWidth, c = W / 2, r = W * 0.395;
          AUD.forEach(function (a) {
            var t = labelMid[a.key] * Math.PI / 180;
            labels[a.key].style.left = (c + r * Math.cos(t)) + "px";
            labels[a.key].style.top = (c + r * Math.sin(t)) + "px";
          });
        }

        document.getElementById("hub").addEventListener("click", function () {
          tickWheel(-1);
          setFilter(null);
        });

        function tickWheel(dir) {
          spokesAngle += (360 / 8) * (dir || 1);
          spokesEl.style.transform = "rotate(" + spokesAngle + "deg)";
        }

        function setWedgeHl(key, on) {
          if (key && wedges[key]) wedges[key].classList.toggle("hl", !!on);
        }

        function setFilter(key) {
          filter = key;
          order = poolFor(key);
          dial.classList.toggle("filtered", !!key);
          AUD.forEach(function (a) {
            wedges[a.key].classList.toggle("on", a.key === key);
            labels[a.key].classList.toggle("on", a.key === key);
          });
          if (key) { tickWheel(1); renderFan(key); } else { render(); }
        }

        /* ---------- deck ---------- */
        function poolFor(key) {
          var all = demos.map(function (_, i) { return i; });
          return key ? all.filter(function (i) { return demos[i].audience === key; }) : all;
        }
        var order = poolFor(null);

        function badge(d) {
          var validated = /validated/.test(d.badge || "");
          if (validated) return '<span class="leaf-badge"><span class="b"></span>validated · 0 mismatches</span>';
          if (d.inBrowser) return '<span class="leaf-badge browser"><span class="b"></span>runs in-browser</span>';
          return '<span class="leaf-badge"><span class="b"></span>live</span>';
        }
        function catTag(d) {
          if (!d.audience) return "";
          return '<span class="leaf-cat"><span class="sw"></span>' + catLabel[d.audience] + '</span>';
        }
        function hookWedgeHover(el, d) {
          el.addEventListener("pointerenter", function () { setWedgeHl(d.audience, true); });
          el.addEventListener("pointerleave", function () { setWedgeHl(d.audience, false); });
        }

        var JITTER = [0, -1.4, 1.1, -0.7, 0.5];
        function poseFor(p) {
          var y = p * 16, s = 1 - p * 0.05, z = -p * 40, r = JITTER[p] || 0;
          return "translate(-50%," + y + "px) translateZ(" + z + "px) scale(" + s + ") rotate(" + r + "deg)";
        }

        function render() {
          deck.innerHTML = "";
          for (var p = Math.min(VISIBLE, order.length) - 1; p >= 0; p--) {
            var idx = order[p];
            var d = demos[idx];
            var a = document.createElement("a");
            a.className = "leaf" + (p === 0 ? " top" : "");
            a.setAttribute("data-pos", p);
            a.href = PROTO.DEST[d.id]; a.target = "_blank"; a.rel = "noreferrer";
            a.style.zIndex = String(100 - p);
            a.style.transform = poseFor(p);
            a.style.setProperty("--cat", catColor[d.audience] || "var(--rule)");
            a.innerHTML = (p === 0 ? PROTO.preview(d.id, "leaf-thumb")
                                   : '<span class="leaf-thumb preview-' + d.id + '"></span>') +
              '<span class="leaf-body"><span class="leaf-top"><span class="leaf-k">' + d.kicker +
              '</span>' + catTag(d) + badge(d) + '</span><span class="leaf-h">' + d.title +
              '</span><span class="leaf-d">' + d.desc + '</span></span>';
            if (p === 0) hookWedgeHover(a, d);
            deck.appendChild(a);
          }
          bindTop();
          var top = demos[order[0]];
          document.getElementById("cn").textContent = String(poolFor(filter).indexOf(order[0]) + 1);
          document.getElementById("ct").textContent = String(order.length);
          document.getElementById("ck").textContent = top.kicker;
        }

        function renderFan(key) {
          var pool = poolFor(key);
          var rest = demos.map(function (_, i) { return i; })
            .filter(function (i) { return demos[i].audience !== key; });
          deck.innerHTML = "";

          rest.slice(0, 3).forEach(function (idx, p) {
            var d = demos[idx];
            var a = document.createElement("a");
            a.className = "leaf resid";
            a.setAttribute("data-pos", p + 1);
            a.href = PROTO.DEST[d.id]; a.target = "_blank"; a.rel = "noreferrer";
            a.style.zIndex = String(40 - p);
            a.style.transform = poseFor(p + 1) + " translateY(34px)";
            a.style.setProperty("--cat", catColor[d.audience] || "var(--rule)");
            a.innerHTML = '<span class="leaf-thumb preview-' + d.id + '"></span>' +
              '<span class="leaf-body"></span>';
            deck.appendChild(a);
          });

          var k = pool.length;
          pool.forEach(function (idx, i) {
            var d = demos[idx];
            var a = document.createElement("a");
            a.className = "leaf fan";
            a.setAttribute("data-pos", "0");
            a.href = PROTO.DEST[d.id]; a.target = "_blank"; a.rel = "noreferrer";
            a.style.zIndex = String(200 + i);
            a.style.setProperty("--cat", catColor[d.audience] || "var(--rule)");
            a.style.setProperty("--fx", "0px");
            a.style.setProperty("--fy", (Math.min(i, 3) * 16) + "px");
            a.style.setProperty("--fr", "0deg");
            a.innerHTML = PROTO.preview(d.id, "leaf-thumb") +
              '<span class="leaf-body"><span class="leaf-top"><span class="leaf-k">' + d.kicker +
              '</span>' + catTag(d) + badge(d) + '</span><span class="leaf-h">' + d.title +
              '</span><span class="leaf-d">' + d.desc + '</span></span>';
            hookWedgeHover(a, d);
            deck.appendChild(a);

            var c = i - (k - 1) / 2;
            requestAnimationFrame(function () {
              requestAnimationFrame(function () {
                a.style.setProperty("--fx", (c * 128) + "px");
                a.style.setProperty("--fy", (26 + Math.abs(c) * 12) + "px");
                a.style.setProperty("--fr", (c * 6) + "deg");
              });
            });
          });

          document.getElementById("cn").textContent = String(k);
          document.getElementById("ct").textContent = String(k);
          document.getElementById("ck").textContent = catLabel[key] + " — pulled from the deck";
        }

        function advance(dir, tossDx) {
          if (filter) return;
          if (animating || order.length < 2) return;
          animating = true;
          tickWheel(dir);
          var topEl = deck.querySelector(".leaf.top");
          if (dir > 0) {
            var left = typeof tossDx === "number" && tossDx < 0;
            topEl.classList.add("settle");
            topEl.style.transform = left
              ? "translate(-170%,-30px) rotate(-16deg)"
              : "translate(70%,-30px) rotate(16deg)";
            topEl.style.opacity = "0";
            setTimeout(function () { order.push(order.shift()); render(); animating = false; }, 300);
          } else {
            order.unshift(order.pop());
            render();
            var t = deck.querySelector(".leaf.top");
            t.style.transition = "none";
            t.style.transform = "translate(-160%,-40px) rotate(-14deg)";
            t.style.opacity = "0";
            requestAnimationFrame(function () {
              t.classList.add("settle");
              t.style.transform = poseFor(0); t.style.opacity = "1";
              setTimeout(function () { animating = false; }, 320);
            });
          }
        }

        function bindTop() {
          var top = deck.querySelector(".leaf.top");
          if (!top) return;
          var startX = 0, startY = 0, dx = 0, dy = 0, drag = false;
          top.addEventListener("pointerdown", function (e) {
            if (animating) return;
            drag = true; dx = 0; dy = 0; startX = e.clientX; startY = e.clientY;
            top.style.transition = "none"; top.setPointerCapture(e.pointerId);
          });
          top.addEventListener("pointermove", function (e) {
            if (!drag) return;
            dx = e.clientX - startX; dy = e.clientY - startY;
            top.style.transform = "translate(calc(-50% + " + dx + "px)," + dy * 0.5 + "px) rotate(" + dx * 0.05 + "deg)";
          });
          top.addEventListener("pointerup", function (e) {
            if (!drag) return; drag = false;
            if (Math.hypot(dx, dy * 0.5) > 90) { advance(1, dx); }
            else { top.classList.add("settle"); top.style.transform = poseFor(0); }
            if (Math.hypot(dx, dy) > 6) { e.preventDefault(); top.addEventListener("click", swallow, { once: true, capture: true }); }
          });
          function swallow(ev) { ev.preventDefault(); ev.stopPropagation(); }
        }

        document.getElementById("next").addEventListener("click", function () { advance(1); });
        document.getElementById("prev").addEventListener("click", function () { advance(-1); });
        document.addEventListener("keydown", function (e) {
          if (e.key === "ArrowRight") advance(1);
          else if (e.key === "ArrowLeft") advance(-1);
        });

        window.addEventListener("resize", layoutDial);
        render(); layoutDial();

        // deep-link: #builders / #ai / #gov
        var hashKey = (window.location.hash || "").slice(1);
        if (catLabel[hashKey]) setFilter(hashKey);
      })();
    </script>
  </body>
</html>
