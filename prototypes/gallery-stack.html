<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Stack — the demo gallery</title>
    <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
    <link
      href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --cloud: #f0eee6; --paper: #faf9f5; --ink: #1a1915; --ink-soft: #6f6d64;
        --ink-faint: #9b9890; --clay: #cc785c; --clay-strong: #b1573b;
        --rule: #e3dfd3; --rule-soft: #ece9df; --ga: #2f6b3a;
        --serif: "Newsreader", Georgia, serif;
        --sans: "Inter", ui-sans-serif, system-ui, sans-serif;
        --mono: "IBM Plex Mono", ui-monospace, monospace;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; }
      body { background: var(--cloud); color: var(--ink); font-family: var(--sans);
        min-height: 100vh; -webkit-font-smoothing: antialiased; }

      .lab { width: min(1000px, calc(100% - 56px)); margin: 0 auto; padding: clamp(20px, 4vh, 44px) 0 40px; }
      .head { text-align: center; }
      .eyebrow { font-family: var(--mono); font-size: 0.64rem; letter-spacing: 0.22em;
        text-transform: uppercase; color: var(--clay-strong); margin: 0 0 10px; }
      h1 { font-family: var(--serif); font-weight: 500; font-size: clamp(2rem, 4.4vw, 3.1rem);
        line-height: 1.02; letter-spacing: -0.02em; margin: 0 0 8px; }
      h1 em { font-style: italic; color: var(--clay-strong); }
      .sub { margin: 0 auto; color: var(--ink-soft); font-size: 1rem; line-height: 1.5; max-width: 52ch; }
      .counter { font-family: var(--mono); font-size: 0.72rem; letter-spacing: 0.14em;
        text-transform: uppercase; color: var(--ink-faint); margin: 0; }
      .counter b { color: var(--clay-strong); }
      .hint { margin: 10px 0 0; text-align: center; font-family: var(--mono); font-size: 0.58rem;
        letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-faint); }

      .controls { display: flex; align-items: center; justify-content: center; gap: 18px; margin-top: 4px; }
      .sbtn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 999px;
        border: 1px solid var(--rule); background: var(--paper); color: var(--ink); cursor: pointer;
        font-family: var(--mono); font-size: 0.64rem; letter-spacing: 0.1em; text-transform: uppercase;
        transition: border-color .16s ease, color .16s ease; }
      .sbtn:hover { border-color: var(--clay); color: var(--clay-strong); }

      /* ---- the deck ---- */
      .deck-wrap { position: relative; height: clamp(400px, 62vh, 520px); perspective: 1400px; }
      .deck { position: absolute; inset: 0; }

      /* manila-folder tabs sticking up from the top of the pile — the audience filter */
      .dtabs { position: relative; z-index: 500; display: flex; justify-content: center;
        align-items: flex-end; gap: 6px; margin: clamp(18px, 3.5vh, 34px) 0 -2px; }
      .dtab { display: inline-flex; align-items: center; gap: 6px; padding: 8px 15px 12px;
        border: 1px solid var(--rule); border-bottom: none;
        border-top: 3px solid var(--cat, var(--ink-faint));
        border-radius: 10px 10px 0 0; background: var(--paper); cursor: pointer;
        font-family: var(--mono); font-size: 0.56rem; letter-spacing: 0.08em; text-transform: uppercase;
        color: var(--ink-soft); box-shadow: 0 -3px 10px rgba(26,25,21,.05); white-space: nowrap;
        transition: transform .16s ease, background .16s ease, color .16s ease, border-color .16s ease; }
      .dtab b { color: var(--cat, var(--clay-strong)); font-weight: 600; }
      .dtab:hover { transform: translateY(-4px); color: var(--ink); }
      .dtab.on { background: color-mix(in srgb, var(--cat, var(--ink)) 10%, var(--paper));
        color: var(--ink); transform: translateY(-6px);
        border-color: color-mix(in srgb, var(--cat, var(--ink)) 45%, var(--rule));
        border-top-color: var(--cat, var(--ink)); border-bottom: none; }
      .dtab .mk { font-family: var(--serif); font-size: 0.8rem; color: var(--clay-strong); }

      .leaf { display: flex; flex-direction: column; position: absolute; left: 50%; top: 0; width: min(88%, 400px);
        transform-origin: center bottom; will-change: transform;
        border-radius: 16px; overflow: hidden; background: var(--paper);
        border: 1px solid var(--rule); box-shadow: 0 18px 40px rgba(26,25,21,.14);
        text-decoration: none; color: inherit; }
      .leaf-thumb { display: block; position: relative; height: 246px; overflow: hidden; background: var(--rule-soft);
        border-bottom: 1px solid var(--rule-soft); }
      .leaf-thumb iframe { --preview-scale: 0.42; }
      .leaf-body { display: flex; flex-direction: column; gap: 6px; padding: 15px 18px 18px; }
      .leaf-top { display: flex; align-items: center; gap: 10px; margin-bottom: 5px; }
      .leaf { border-left: 3px solid var(--cat, var(--rule)); }
      .leaf-k { font-family: var(--mono); font-size: 0.6rem; letter-spacing: 0.14em;
        text-transform: uppercase; color: var(--clay-strong); }
      .leaf-cat { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 999px;
        border: 1px solid color-mix(in srgb, var(--cat) 40%, var(--rule));
        background: color-mix(in srgb, var(--cat) 8%, transparent);
        font-family: var(--mono); font-size: 0.52rem; letter-spacing: 0.08em; text-transform: uppercase;
        color: color-mix(in srgb, var(--cat) 70%, var(--ink)); }
      .leaf-cat .sw { width: 6px; height: 6px; border-radius: 50%; background: var(--cat); }
      .leaf-badge { margin-left: auto; font-family: var(--mono); font-size: 0.54rem; letter-spacing: 0.08em;
        text-transform: uppercase; color: var(--ink-soft); display: inline-flex; align-items: center; gap: 5px; }
      .leaf-badge .b { width: 6px; height: 6px; border-radius: 50%; background: var(--ga); }
      .leaf-badge.browser .b { background: #2f6b6f; }
      .leaf-h { font-family: var(--serif); font-weight: 500; font-size: 1.4rem; letter-spacing: -0.01em; margin: 0 0 6px; }
      .leaf-d { margin: 0; color: var(--ink-soft); font-size: 0.9rem; line-height: 1.45; }
      /* deeper cards hide their body so the pile reads as clean stacked edges */
      .leaf[data-pos]:not([data-pos="0"]) .leaf-body { opacity: 0; }
      .leaf.top { cursor: grab; box-shadow: 0 26px 60px rgba(26,25,21,.20); }
      .leaf.top:active { cursor: grabbing; }
      .leaf.settle { transition: transform .34s cubic-bezier(.2,.7,.2,1), opacity .34s ease; }

      /* fan mode — the selected audience's cards pop out of the deck into a hand.
         Pose lives in CSS vars so hover can lift a card without losing its fan angle. */
      .leaf.fan {
        transform: translate(calc(-50% + var(--fx, 0px)), var(--fy, 0px)) rotate(var(--fr, 0deg));
        transform-origin: center 140%;
        transition: transform .5s cubic-bezier(.2,.75,.25,1.05), box-shadow .25s ease;
        cursor: pointer;
      }
      .leaf.fan:hover {
        transform: translate(calc(-50% + var(--fx, 0px)), calc(var(--fy, 0px) - 26px))
          rotate(var(--fr, 0deg)) scale(1.04);
        box-shadow: 0 32px 64px rgba(26,25,21,.24);
        z-index: 400 !important;
      }
      .leaf.fan .leaf-body { opacity: 1; }
      .leaf.resid { opacity: .45; filter: saturate(.6); pointer-events: none;
        transition: transform .4s ease, opacity .4s ease; }

      a:focus-visible, button:focus-visible { outline: 2px solid var(--clay-strong); outline-offset: 3px; border-radius: 10px; }

      @media (max-width: 860px) {
        .deck-wrap { height: clamp(380px, 58vh, 480px); }
        .dtabs { flex-wrap: wrap; }
      }
    </style>
  </head>
  <body>
    <main class="lab">
      <div class="head">
        <p class="eyebrow">The demo gallery</p>
        <h1>One deck. <em>Deal through it.</em></h1>
        <p class="sub">Eight products, one verified substrate underneath every card. Toss the top card in any direction and the next deals up live — or pull a whole hand with the folder tabs.</p>
      </div>

      <div class="dtabs" id="dtabs" role="group" aria-label="Pull a hand by audience"></div>

      <div class="deck-wrap">
        <div class="deck" id="deck"></div>
      </div>

      <div class="controls">
        <button class="sbtn" id="prev">◄ Back</button>
        <p class="counter"><b id="cn">1</b> / <span id="ct">8</span> · <span id="ck">FinBot</span></p>
        <button class="sbtn" id="next">Next ►</button>
      </div>
      <p class="hint">Drag a card sideways to toss it</p>
    </main>

    <script src="data.js"></script>
    <script src="switcher.js"></script>
    <script>
      (function () {
        var demos = PROTO.DEMOS;
        var N = demos.length;
        var deck = document.getElementById("deck");
        var VISIBLE = 4;
        var animating = false;

        var catColor = {}, catLabel = {};
        PROTO.AUDIENCES.forEach(function (a) { catColor[a.key] = a.color; catLabel[a.key] = a.label; });

        // the deck can be "cut" to one audience via the divider tabs
        var filter = null;
        function poolFor(key) {
          var all = demos.map(function (_, i) { return i; });
          return key ? all.filter(function (i) { return demos[i].audience === key; }) : all;
        }
        var order = poolFor(null); // front → back, within the current cut

        var tabsEl = document.getElementById("dtabs");
        var tabs = [];
        function addTab(key, html, color) {
          var b = document.createElement("button");
          b.className = "dtab" + (key === filter ? " on" : "");
          if (color) b.style.setProperty("--cat", color);
          b.innerHTML = html;
          b.addEventListener("click", function () { setFilter(filter === key ? null : key); });
          tabsEl.appendChild(b);
          tabs.push({ key: key, el: b });
        }
        addTab(null, '<span class="mk">∀</span> All <b>' + N + "</b>");
        PROTO.AUDIENCES.forEach(function (a) {
          addTab(a.key, a.label + " <b>" + poolFor(a.key).length + "</b>", a.color);
        });
        function setFilter(key) {
          filter = key;
          order = poolFor(key);
          tabs.forEach(function (t) { t.el.classList.toggle("on", t.key === filter); });
          if (filter) renderFan(filter); else render();
        }

        // Fan mode: the selected audience's cards fly out of the pile into a
        // hand of cards; everything else stays behind as a dimmed stub.
        function renderFan(key) {
          var pool = poolFor(key);
          var rest = demos.map(function (_, i) { return i; })
            .filter(function (i) { return demos[i].audience !== key; });
          deck.innerHTML = "";

          // residual pile, behind the hand
          rest.slice(0, 3).forEach(function (idx, p) {
            var d = demos[idx];
            var a = document.createElement("a");
            a.className = "leaf resid";
            a.setAttribute("data-pos", p + 1); // hides the body — reads as edges
            a.href = PROTO.DEST[d.id]; a.target = "_blank"; a.rel = "noreferrer";
            a.style.zIndex = String(40 - p);
            a.style.transform = poseFor(p + 1) + " translateY(34px)";
            a.style.setProperty("--cat", catColor[d.audience] || "var(--rule)");
            a.innerHTML = '<span class="leaf-thumb preview-' + d.id + '"></span>' +
              '<span class="leaf-body"></span>';
            deck.appendChild(a);
          });

          // the hand — start each card at its deck pose, then let the
          // transition carry it to its fan pose (the "pop out")
          var k = pool.length;
          pool.forEach(function (idx, i) {
            var d = demos[idx];
            var a = document.createElement("a");
            a.className = "leaf fan";
            a.setAttribute("data-pos", "0");
            a.href = PROTO.DEST[d.id]; a.target = "_blank"; a.rel = "noreferrer";
            a.style.zIndex = String(200 + i);
            a.style.setProperty("--cat", catColor[d.audience] || "var(--rule)");
            a.style.setProperty("--fx", "0px");
            a.style.setProperty("--fy", (Math.min(i, 3) * 16) + "px");
            a.style.setProperty("--fr", "0deg");
            a.innerHTML = PROTO.preview(d.id, "leaf-thumb") +
              '<span class="leaf-body"><span class="leaf-top"><span class="leaf-k">' + d.kicker +
              '</span>' + catTag(d) + badge(d) + '</span><span class="leaf-h">' + d.title +
              '</span><span class="leaf-d">' + d.desc + '</span></span>';
            deck.appendChild(a);

            var c = i - (k - 1) / 2; // signed offset from the hand's centre
            requestAnimationFrame(function () {
              requestAnimationFrame(function () {
                // hand fans symmetrically under the folder tabs
                a.style.setProperty("--fx", (c * 138) + "px");
                a.style.setProperty("--fy", (26 + Math.abs(c) * 12) + "px");
                a.style.setProperty("--fr", (c * 6) + "deg");
              });
            });
          });

          document.getElementById("cn").textContent = String(k);
          document.getElementById("ct").textContent = String(k);
          document.getElementById("ck").textContent =
            catLabel[key] + " — pulled from the deck";
        }

        function badge(d) {
          var validated = /validated/.test(d.badge || "");
          if (validated) return '<span class="leaf-badge"><span class="b"></span>validated · 0 mismatches</span>';
          if (d.inBrowser) return '<span class="leaf-badge browser"><span class="b"></span>runs in-browser</span>';
          return '<span class="leaf-badge"><span class="b"></span>live</span>';
        }
        function catTag(d) {
          if (!d.audience) return "";
          return '<span class="leaf-cat"><span class="sw"></span>' + catLabel[d.audience] + '</span>';
        }

        // transform for a card at stack position p (0 = top); deeper cards get a
        // small alternating skew so the pile reads as physically dealt
        var JITTER = [0, -1.4, 1.1, -0.7, 0.5];
        function poseFor(p) {
          var y = p * 16;            // each deeper card sinks down a touch
          var s = 1 - p * 0.05;      // and shrinks
          var z = -p * 40;           // pushed back in 3D
          var r = JITTER[p] || 0;
          return "translate(-50%," + y + "px) translateZ(" + z + "px) scale(" + s + ") rotate(" + r + "deg)";
        }

        function render(tossIndex, dir) {
          deck.innerHTML = "";
          // render back-to-front so DOM order gives correct stacking
          for (var p = Math.min(VISIBLE, order.length) - 1; p >= 0; p--) {
            var idx = order[p];
            var d = demos[idx];
            var a = document.createElement("a");
            a.className = "leaf" + (p === 0 ? " top" : "");
            a.setAttribute("data-pos", p);
            a.href = PROTO.DEST[d.id];
            a.target = "_blank"; a.rel = "noreferrer";
            a.style.zIndex = String(100 - p);
            a.style.transform = poseFor(p);
            a.style.setProperty("--cat", catColor[d.audience] || "var(--rule)");
            a.innerHTML = (p === 0 ? PROTO.preview(d.id, "leaf-thumb")
                                   : '<span class="leaf-thumb preview-' + d.id + '"></span>') +
              '<span class="leaf-body"><span class="leaf-top"><span class="leaf-k">' + d.kicker +
              '</span>' + catTag(d) + badge(d) + '</span><span class="leaf-h">' + d.title +
              '</span><span class="leaf-d">' + d.desc + '</span></span>';
            deck.appendChild(a);
          }
          bindTop();
          var top = demos[order[0]];
          // position within the current cut, not the global list
          document.getElementById("cn").textContent = String(poolFor(filter).indexOf(order[0]) + 1);
          document.getElementById("ct").textContent = String(order.length);
          document.getElementById("ck").textContent = top.kicker;
        }

        function advance(dir, tossDx) {
          if (filter) return; // fan mode — the hand is on the table, nothing to deal
          if (animating || order.length < 2) return;
          animating = true;
          var topEl = deck.querySelector(".leaf.top");
          if (dir > 0) {
            // fling along the drag direction (default: right)
            var left = typeof tossDx === "number" && tossDx < 0;
            topEl.classList.add("settle");
            topEl.style.transform = left
              ? "translate(-170%,-30px) rotate(-16deg)"
              : "translate(70%,-30px) rotate(16deg)";
            topEl.style.opacity = "0";
            setTimeout(function () { order.push(order.shift()); render(); animating = false; }, 300);
          } else {
            // bring the back card to the front, sliding in
            order.unshift(order.pop());
            render();
            var t = deck.querySelector(".leaf.top");
            t.style.transition = "none";
            t.style.transform = "translate(-160%,-40px) rotate(-14deg)";
            t.style.opacity = "0";
            requestAnimationFrame(function () {
              t.classList.add("settle");
              t.style.transform = poseFor(0); t.style.opacity = "1";
              setTimeout(function () { animating = false; }, 320);
            });
          }
        }

        function bindTop() {
          var top = deck.querySelector(".leaf.top");
          if (!top) return;
          var startX = 0, startY = 0, dx = 0, dy = 0, drag = false;
          top.addEventListener("pointerdown", function (e) {
            if (animating) return;
            drag = true; dx = 0; dy = 0; startX = e.clientX; startY = e.clientY;
            top.style.transition = "none"; top.setPointerCapture(e.pointerId);
          });
          top.addEventListener("pointermove", function (e) {
            if (!drag) return;
            dx = e.clientX - startX; dy = e.clientY - startY;
            // the card follows the hand on both axes and tilts with the throw
            top.style.transform = "translate(calc(-50% + " + dx + "px)," + dy * 0.5 + "px) rotate(" + dx * 0.05 + "deg)";
          });
          top.addEventListener("pointerup", function (e) {
            if (!drag) return; drag = false;
            if (Math.hypot(dx, dy * 0.5) > 90) { advance(1, dx); }
            else { top.classList.add("settle"); top.style.transform = poseFor(0); }
            if (Math.hypot(dx, dy) > 6) { e.preventDefault(); top.addEventListener("click", swallow, { once: true, capture: true }); }
          });
          function swallow(ev) { ev.preventDefault(); ev.stopPropagation(); }
        }

        document.getElementById("next").addEventListener("click", function () { advance(1); });
        document.getElementById("prev").addEventListener("click", function () { advance(-1); });
        document.addEventListener("keydown", function (e) {
          if (e.key === "ArrowRight") advance(1);
          else if (e.key === "ArrowLeft") advance(-1);
        });

        render();

        // deep-link a cut: #builders / #ai / #gov fans that audience on load
        var hashKey = (window.location.hash || "").slice(1);
        if (catLabel[hashKey]) setFilter(hashKey);
      })();
    </script>
  </body>
</html>
