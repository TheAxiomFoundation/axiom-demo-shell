<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Corpus — the foundation piece</title>
    <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
    <link
      href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --cloud: #f0eee6; --paper: #faf9f5; --ink: #1a1915; --ink-soft: #6f6d64;
        --ink-faint: #9b9890; --clay: #cc785c; --clay-strong: #b1573b;
        --rule: #e3dfd3; --rule-soft: #ece9df;
        --serif: "Newsreader", Georgia, serif;
        --sans: "Inter", ui-sans-serif, system-ui, sans-serif;
        --mono: "IBM Plex Mono", ui-monospace, monospace;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; }
      body { background: var(--cloud); color: var(--ink); font-family: var(--sans);
        min-height: 100vh; display: flex; flex-direction: column;
        -webkit-font-smoothing: antialiased; }

      .lab { width: min(1180px, calc(100% - 48px)); margin: 0 auto;
        flex: 1; display: flex; flex-direction: column; justify-content: center;
        padding: clamp(24px, 5vh, 56px) 0; }
      .head { text-align: center; margin-bottom: clamp(18px, 3.5vh, 30px); }
      .eyebrow { font-family: var(--mono); font-size: 0.64rem; letter-spacing: 0.22em;
        text-transform: uppercase; color: var(--clay-strong); margin: 0 0 10px; }
      h1 { font-family: var(--serif); font-weight: 500; font-size: clamp(1.7rem, 3.4vw, 2.4rem);
        line-height: 1.04; letter-spacing: -0.02em; margin: 0 0 6px; }
      .sub { margin: 0 auto; color: var(--ink-soft); font-size: 0.95rem; max-width: 52ch; }

      /* ── the corpus band — same component as the grid study; destined for the landing page ── */
      .corpus { display: grid; grid-template-columns: minmax(320px, 5fr) 7fr; overflow: hidden;
        border: 1px solid var(--rule); border-radius: 16px;
        background: var(--paper); text-decoration: none; color: var(--ink);
        box-shadow: 0 18px 44px rgba(26, 25, 21, 0.08);
        transition: border-color 160ms ease, box-shadow 160ms ease; }
      .corpus:hover { border-color: var(--clay); box-shadow: 0 22px 54px rgba(26, 25, 21, 0.13); }
      .corpus-copy { display: flex; flex-direction: column; justify-content: center; gap: 12px;
        padding: clamp(24px, 3.5vw, 44px); }
      .corpus-kicker { font-family: var(--mono); font-size: 0.62rem; letter-spacing: 0.2em;
        text-transform: uppercase; color: var(--clay-strong); }
      .corpus-title { font-family: var(--serif); font-weight: 500; margin: 0;
        font-size: clamp(1.5rem, 2.8vw, 2.1rem); line-height: 1.1; letter-spacing: -0.018em; }
      .corpus-title em { font-style: italic; color: var(--clay-strong); }
      .corpus-desc { margin: 0; color: var(--ink-soft); font-size: 0.94rem; line-height: 1.55; max-width: 44ch; }
      .corpus-cta { display: inline-flex; align-items: center; gap: 7px; margin-top: 6px;
        font-size: 0.9rem; font-weight: 500; color: var(--clay-strong); }
      .corpus-cta::after { content: "↗"; transition: transform 160ms ease; }
      .corpus:hover .corpus-cta::after { transform: translate(2px, -2px); }

      .corpus-stats { display: flex; gap: clamp(18px, 3vw, 34px); margin-top: 10px; flex-wrap: wrap; }
      .cst { display: flex; flex-direction: column; gap: 2px; }
      .cst b { font-family: var(--serif); font-weight: 500; font-size: clamp(1.3rem, 2.2vw, 1.7rem);
        letter-spacing: -0.015em; color: var(--ink); }
      .cst span { font-family: var(--mono); font-size: 0.58rem; letter-spacing: 0.12em;
        text-transform: uppercase; color: var(--ink-faint); }

      /* the wall: drifting columns of citations — breadth, not one provision at a time */
      .corpus-viz { position: relative; overflow: hidden; min-height: 380px;
        background: var(--rule-soft); border-left: 1px solid var(--rule-soft);
        -webkit-mask-image: linear-gradient(to bottom, transparent, black 14%, black 86%, transparent);
        mask-image: linear-gradient(to bottom, transparent, black 14%, black 86%, transparent); }
      .cv-cols { position: absolute; inset: 0; display: flex; gap: clamp(18px, 3vw, 40px);
        justify-content: center; padding: 0 clamp(16px, 3vw, 36px); }
      .cv-col { flex: 1; min-width: 0; overflow: hidden; }
      .cv-track { display: flex; flex-direction: column; gap: 13px;
        animation: cvdrift var(--dur, 60s) linear infinite; }
      .cv-col:nth-child(2) .cv-track { --dur: 84s; }
      .cv-col:nth-child(3) .cv-track { --dur: 70s; }
      .cv-item { font-family: var(--mono); font-size: 0.66rem; letter-spacing: 0.04em;
        color: var(--ink-faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .cv-item.hot { color: var(--clay-strong); }
      @keyframes cvdrift { to { transform: translateY(-50%); } }
      @media (prefers-reduced-motion: reduce) { .cv-track { animation: none; } }
      @media (max-width: 860px) {
        .corpus { grid-template-columns: 1fr; }
        .corpus-viz { min-height: 220px; border-left: 0; border-top: 1px solid var(--rule-soft); }
      }
    </style>
  </head>
  <body data-switcher="bottom">
    <main class="lab">
      <header class="head">
        <p class="eyebrow">Foundation piece · study</p>
        <h1>The corpus band, on its own</h1>
        <p class="sub">Extracted from the grid study so it can be judged solo — this component is
          destined for the landing page itself, above the demo gallery.</p>
      </header>
      <div id="corpus"></div>
    </main>

    <script src="data.js"></script>
    <script src="switcher.js"></script>
    <script>
      (function () {
        "use strict";

        // the citation wall — real citation formats, used as texture only
        var CITES = [
          "us:statutes/7/2011", "us:statutes/7/2012", "us:statutes/7/2014",
          "us:statutes/7/2015/d", "us:statutes/7/2016", "us:statutes/7/2017/a",
          "us:statutes/26/24/h", "us:statutes/26/32", "us:statutes/42/1382",
          "us:cfr/7/271.2", "us:cfr/7/273.9", "us:cfr/7/273.10", "us:cfr/26/1.32-2",
          "us:state/co/10-ccr-2506-1", "us:state/co/10-ccr-2506-1/4.401",
          "us:state/ca/mpp/63-503", "us:state/ny/18-nycrr/387",
          "uk:companies/2006/382", "uk:companies/2006/383", "uk:ita/2007/8",
          "uk:wra/2012/96", "uk:uc-regs/2013/22",
          "ca:laws-lois/i-3.3/117", "ca:laws-lois/c-8/44", "ca:laws-lois/o-9/12",
          "nz:legislation/2007/97/mA1", "us:statutes/7/2020/e",
          "us:cfr/7/273.2", "uk:companies/2006/384", "us:state/co/10-ccr-2506-1/4.607"
        ];
        function wallCol(seed) {
          var items = [];
          for (var k = 0; k < CITES.length; k++) {
            var c = CITES[(k * seed + seed) % CITES.length];
            items.push('<span class="cv-item' + ((k + seed) % 9 === 0 ? " hot" : "") + '">' + c + '</span>');
          }
          var half = items.join("");
          return '<div class="cv-col"><div class="cv-track">' + half + half + '</div></div>';
        }

        document.getElementById("corpus").innerHTML =
          '<a class="corpus" href="' + PROTO.DEST.law + '" target="_blank" rel="noreferrer" data-demo="law">' +
            '<span class="corpus-copy">' +
              '<span class="corpus-kicker">The corpus</span>' +
              '<h2 class="corpus-title">The whole law, <em>word for word.</em></h2>' +
              '<p class="corpus-desc">Statutes, regulations, and guidance — stored verbatim, ' +
                'encoded as machine-executable rules, every value tied to its source text.</p>' +
              '<span class="corpus-stats">' +
                '<span class="cst"><b>1,742,391</b><span>provisions</span></span>' +
                '<span class="cst"><b>4</b><span>countries</span></span>' +
                '<span class="cst"><b>51</b><span>states</span></span>' +
              '</span>' +
              '<span class="corpus-cta">Explore the corpus</span>' +
            '</span>' +
            '<span class="corpus-viz" aria-hidden="true"><span class="cv-cols">' +
              wallCol(3) + wallCol(5) + wallCol(7) +
            '</span></span>' +
          '</a>';
      })();
    </script>
  </body>
</html>
