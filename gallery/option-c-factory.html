<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Option C · Factory line — Axiom Demos</title>
    <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../styles.css" />
    <style>
      /* ---- Option C: factory line — the page IS the production line ----
         01 source → 02 gauntlet → 03 outputs on one conveyor. */
      .proto-tag {
        position: fixed; top: 10px; right: 12px; z-index: 20;
        font-family: var(--mono); font-size: 0.6rem; letter-spacing: 0.12em;
        text-transform: uppercase; color: var(--ink-faint);
        background: var(--paper); border: 1px solid var(--rule);
        border-radius: 999px; padding: 4px 10px;
      }
      .line {
        display: grid;
        grid-template-columns: 0.85fr 0.85fr 1.6fr;
        gap: 0; align-items: stretch;
        border: 1px solid var(--rule); border-radius: 14px; overflow: hidden;
        background: var(--paper);
      }
      .stage { position: relative; padding: 16px 16px 18px; min-width: 0; }
      .stage + .stage { border-left: 1px solid var(--rule); }
      .stage--out { background:
        linear-gradient(180deg, color-mix(in srgb, var(--clay) 5%, var(--paper)), var(--paper)); }

      .stage-head { display: flex; align-items: center; gap: 9px; margin: 0 0 12px; }
      .stage-num {
        display: grid; place-items: center; width: 30px; height: 30px; flex: none;
        border: 1.5px solid var(--clay); border-radius: 50%; background: var(--cloud);
        font-family: var(--mono); font-size: 0.62rem; font-weight: 600; color: var(--clay-strong);
      }
      .stage-name { font-family: var(--serif); font-size: 1.02rem; font-weight: 500; letter-spacing: -0.01em; }
      .stage-sub { font-family: var(--mono); font-size: 0.55rem; letter-spacing: 0.12em;
        text-transform: uppercase; color: var(--ink-faint); }

      /* the conveyor belt line + flowing dashes between stages */
      .stage::after {
        content: ""; position: absolute; top: 30px; right: -1px; width: 22px; height: 1.5px;
        background: repeating-linear-gradient(90deg, var(--clay) 0 5px, transparent 5px 10px);
        z-index: 3;
        animation: flow 700ms linear infinite;
      }
      .stage--out::after { display: none; }
      @keyframes flow { to { background-position: 10px 0; } }
      @media (prefers-reduced-motion: reduce) { .stage::after { animation: none; } }

      .stage-cards { display: flex; flex-direction: column; gap: 9px; }
      .lcard {
        display: grid; grid-template-columns: 78px 1fr; align-items: stretch;
        overflow: hidden; border: 1px solid var(--rule); border-radius: 9px;
        background: var(--cloud); text-decoration: none;
        transition: border-color 160ms ease, transform 160ms ease;
      }
      .lcard:hover { border-color: var(--clay); transform: translateX(2px); }
      .lthumb { position: relative; overflow: hidden; min-height: 56px;
        border-right: 1px solid var(--rule-soft); background: var(--rule-soft); }
      .lthumb iframe { --preview-scale: 0.16; }
      .lbody { padding: 8px 10px; display: flex; flex-direction: column; gap: 2px; justify-content: center; }
      .lk { font-family: var(--mono); font-size: 0.52rem; letter-spacing: 0.1em;
        text-transform: uppercase; color: var(--clay-strong); }
      .lt { font-family: var(--serif); font-size: 0.9rem; font-weight: 500; line-height: 1.12; color: var(--ink); }

      /* the outputs bin — demos dropping out of the machine */
      .bin { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; }
      .ocard {
        position: relative; display: flex; flex-direction: column; overflow: hidden;
        border: 1px solid var(--rule); border-radius: 9px; background: var(--paper);
        text-decoration: none; box-shadow: 0 1px 2px rgba(26, 25, 21, 0.04);
        transition: border-color 160ms ease, box-shadow 160ms ease, transform 160ms ease;
      }
      .ocard:hover { border-color: var(--clay); box-shadow: 0 10px 22px rgba(26,25,21,.1); transform: translateY(-2px); }
      .othumb { position: relative; height: 64px; overflow: hidden;
        border-bottom: 1px solid var(--rule-soft); background: var(--rule-soft); }
      .othumb iframe { --preview-scale: 0.2; }
      .preview-builder iframe { --preview-scale: 0.14; }
      .obody { padding: 7px 10px 9px; display: flex; flex-direction: column; gap: 1px; }
      .ok { font-family: var(--mono); font-size: 0.5rem; letter-spacing: 0.1em;
        text-transform: uppercase; color: var(--clay-strong);
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .ot { font-family: var(--serif); font-size: 0.85rem; font-weight: 500; line-height: 1.1; color: var(--ink); }
      .obadge {
        position: absolute; top: 6px; right: 6px; z-index: 2;
        width: 8px; height: 8px; border-radius: 50%; background: var(--ga);
        box-shadow: 0 0 0 2.5px color-mix(in srgb, var(--ga) 20%, transparent);
      }
      .obadge.browser { background: var(--preview);
        box-shadow: 0 0 0 2.5px color-mix(in srgb, var(--preview) 20%, transparent); }

      @media (max-width: 900px) {
        .line { grid-template-columns: 1fr; }
        .stage + .stage { border-left: none; border-top: 1px solid var(--rule); }
        .stage::after { top: auto; bottom: -1px; right: 50%; width: 1.5px; height: 20px;
          background: repeating-linear-gradient(180deg, var(--clay) 0 5px, transparent 5px 10px); }
      }
      @media (max-width: 480px) { .bin { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <span class="proto-tag">Option C · Factory line</span>
    <header class="nav">
      <a class="wordmark" href="#" aria-label="Axiom demo home">
        <img src="../logos/axiom-foundation.svg" alt="Axiom Foundation" />
      </a>
    </header>

    <main class="page">
      <section class="hero" aria-labelledby="hero-title">
        <h1 id="hero-title">Computable law for&nbsp;all</h1>
        <p class="lede">The factory is real — watch it run, then see what it has produced.</p>
      </section>

      <div class="line">
        <section class="stage" aria-label="Stage 01, source">
          <div class="stage-head">
            <span class="stage-num">01</span>
            <span><span class="stage-name">Source</span><br /><span class="stage-sub">ingested · encoded</span></span>
          </div>
          <div class="stage-cards" id="stage-1"></div>
        </section>

        <section class="stage" aria-label="Stage 02, gauntlet">
          <div class="stage-head">
            <span class="stage-num">02</span>
            <span><span class="stage-name">Gauntlet</span><br /><span class="stage-sub">compiled · oracle-checked</span></span>
          </div>
          <div class="stage-cards" id="stage-2"></div>
        </section>

        <section class="stage stage--out" aria-label="Stage 03, outputs">
          <div class="stage-head">
            <span class="stage-num">03</span>
            <span><span class="stage-name">Output</span><br /><span class="stage-sub">what the machine produced</span></span>
          </div>
          <div class="bin" id="bin"></div>
        </section>
      </div>
    </main>

    <script src="data.js"></script>
    <script>
      (function () {
        function lcards(minis) {
          return minis.map(function (m) {
            return '<a class="lcard" href="' + PROTO.DEST[m.id] + '" target="_blank" rel="noreferrer">' +
              PROTO.preview(m.id, "lthumb") +
              '<span class="lbody"><span class="lk">' + m.kicker + '</span>' +
              '<span class="lt">' + m.title + '</span></span></a>';
          }).join("");
        }
        document.getElementById("stage-1").innerHTML = lcards(PROTO.CHAPTERS[0].minis);
        document.getElementById("stage-2").innerHTML = lcards(PROTO.CHAPTERS[1].minis);

        document.getElementById("bin").innerHTML = PROTO.DEMOS.map(function (d) {
          var validated = /validated/.test(d.badge || "");
          var badge = validated
            ? '<span class="obadge" title="validated · 0 mismatches"></span>'
            : d.inBrowser ? '<span class="obadge browser" title="runs in-browser"></span>' : "";
          return '<a class="ocard" href="' + PROTO.DEST[d.id] + '" target="_blank" rel="noreferrer">' +
            badge + PROTO.preview(d.id, "othumb") +
            '<span class="obody"><span class="ok">' + d.kicker + '</span>' +
            '<span class="ot">' + d.title + '</span></span></a>';
        }).join("");
      })();
    </script>
  </body>
</html>
