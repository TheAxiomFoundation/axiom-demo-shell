<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gallery layout options — tabs</title>
    <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --cloud: #f0eee6; --paper: #faf9f5; --ink: #1a1915; --ink-soft: #6f6d64;
        --ink-faint: #9b9890; --clay: #cc785c; --clay-strong: #b1573b; --rule: #e3dfd3;
        --mono: "IBM Plex Mono", ui-monospace, monospace;
        --sans: "Inter", ui-sans-serif, system-ui, sans-serif;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body { display: flex; flex-direction: column; background: var(--cloud); font-family: var(--sans); }

      .tabbar {
        flex: none; display: flex; align-items: center; gap: 8px;
        padding: 10px 16px; background: var(--paper);
        border-bottom: 1px solid var(--rule);
      }
      .tabbar .label {
        font-family: var(--mono); font-size: 0.62rem; letter-spacing: 0.12em;
        text-transform: uppercase; color: var(--ink-faint); margin-right: 6px;
      }
      .tab {
        display: inline-flex; align-items: baseline; gap: 8px;
        padding: 6px 14px; border: 1px solid var(--rule); border-radius: 999px;
        background: transparent; color: var(--ink-soft); cursor: pointer;
        font-family: var(--sans); font-size: 0.86rem;
        transition: border-color 140ms ease, color 140ms ease, background 140ms ease;
      }
      .tab .k { font-family: var(--mono); font-size: 0.58rem; letter-spacing: 0.1em;
        text-transform: uppercase; color: var(--clay-strong); }
      .tab:hover { border-color: var(--clay); color: var(--ink); }
      .tab[aria-selected="true"] {
        background: var(--ink); color: var(--cloud); border-color: var(--ink);
      }
      .tab[aria-selected="true"] .k { color: color-mix(in srgb, var(--clay) 65%, white); }

      .spacer { flex: 1; }
      .openlink {
        font-family: var(--mono); font-size: 0.62rem; letter-spacing: 0.08em;
        text-transform: uppercase; color: var(--ink-faint); text-decoration: none;
      }
      .openlink:hover { color: var(--clay-strong); }

      .stage { position: relative; flex: 1; min-height: 0; }
      .frame {
        position: absolute; inset: 0; width: 100%; height: 100%; border: 0;
        opacity: 0; pointer-events: none; transition: opacity 120ms ease;
      }
      .frame.active { opacity: 1; pointer-events: auto; }
    </style>
  </head>
  <body>
    <nav class="tabbar" role="tablist" aria-label="Gallery layout options">
      <span class="label">Layout</span>
      <button class="tab" role="tab" data-src="option-a-bento.html" aria-selected="true">
        <span class="k">A</span> Bento mosaic
      </button>
      <button class="tab" role="tab" data-src="option-b-registry.html" aria-selected="false">
        <span class="k">B</span> Registry panel
      </button>
      <button class="tab" role="tab" data-src="option-c-factory.html" aria-selected="false">
        <span class="k">C</span> Factory line
      </button>
      <span class="spacer"></span>
      <a class="openlink" id="openNew" href="option-a-bento.html" target="_blank" rel="noreferrer">Open in new tab ↗</a>
    </nav>

    <div class="stage" id="stage"></div>

    <script>
      (function () {
        var tabs = Array.prototype.slice.call(document.querySelectorAll(".tab"));
        var stage = document.getElementById("stage");
        var openNew = document.getElementById("openNew");
        var frames = {};

        // Mount all three iframes once; toggle visibility so previews never reload.
        tabs.forEach(function (tab, i) {
          var f = document.createElement("iframe");
          f.className = "frame" + (i === 0 ? " active" : "");
          f.src = tab.dataset.src;
          f.title = tab.textContent.trim();
          frames[tab.dataset.src] = f;
          stage.appendChild(f);
        });

        function select(tab) {
          tabs.forEach(function (t) { t.setAttribute("aria-selected", String(t === tab)); });
          Object.keys(frames).forEach(function (src) {
            frames[src].classList.toggle("active", src === tab.dataset.src);
          });
          openNew.href = tab.dataset.src;
        }

        tabs.forEach(function (tab) {
          tab.addEventListener("click", function () { select(tab); });
        });

        // Left/right arrow keys move between tabs.
        document.addEventListener("keydown", function (e) {
          if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
          var cur = tabs.findIndex(function (t) { return t.getAttribute("aria-selected") === "true"; });
          var next = e.key === "ArrowRight" ? (cur + 1) % tabs.length : (cur - 1 + tabs.length) % tabs.length;
          select(tabs[next]); tabs[next].focus();
        });
      })();
    </script>
  </body>
</html>
