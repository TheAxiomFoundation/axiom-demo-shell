<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Use-case grid — the demo gallery</title>
    <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
    <link
      href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --cloud: #f0eee6; --paper: #faf9f5; --ink: #1a1915; --ink-soft: #6f6d64;
        --ink-faint: #9b9890; --clay: #cc785c; --clay-strong: #b1573b;
        --rule: #e3dfd3; --rule-soft: #ece9df;
        --serif: "Newsreader", Georgia, serif;
        --sans: "Inter", ui-sans-serif, system-ui, sans-serif;
        --mono: "IBM Plex Mono", ui-monospace, monospace;
      }
      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      html, body { margin: 0; }
      body { background: var(--cloud); color: var(--ink); font-family: var(--sans);
        min-height: 100vh; -webkit-font-smoothing: antialiased; }

      .lab { width: min(1180px, calc(100% - 48px)); margin: 0 auto;
        padding: clamp(24px, 4.5vh, 48px) 0 70px; }
      .head { text-align: center; }
      .eyebrow { font-family: var(--mono); font-size: 0.64rem; letter-spacing: 0.22em;
        text-transform: uppercase; color: var(--clay-strong); margin: 0 0 10px; }
      h1 { font-family: var(--serif); font-weight: 500; font-size: clamp(2rem, 4.4vw, 3.1rem);
        line-height: 1.02; letter-spacing: -0.02em; margin: 0 0 8px; }
      h1 em { font-style: italic; color: var(--clay-strong); }
      .sub { margin: 0 auto; color: var(--ink-soft); font-size: 1rem; max-width: 56ch; }

      /* ── jump nav: a slim ribbon of the four jobs, sticky while you scroll ── */
      .jumps { position: sticky; top: 0; z-index: 40;
        width: 100vw; margin: clamp(22px, 4vh, 36px) 0 0 calc(50% - 50vw);
        display: flex; flex-wrap: wrap; justify-content: center;
        border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule);
        background: color-mix(in srgb, var(--cloud) 86%, transparent);
        -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
      .jump { flex: none; display: inline-flex; align-items: baseline; gap: 8px;
        padding: 13px 16px; text-decoration: none; position: relative; white-space: nowrap;
        color: var(--ink-soft); transition: color 140ms ease; }
      .jump + .jump::before { content: ""; position: absolute; left: 0; top: 50%;
        transform: translateY(-50%); width: 1px; height: 16px; background: var(--rule); }
      .jump .jt { font-family: var(--serif); font-size: clamp(0.9rem, 0.55rem + 0.5vw, 1.02rem);
        letter-spacing: -0.01em; }
      .jump::after { content: ""; position: absolute; left: 16px; right: 16px; bottom: -1px;
        height: 2px; background: transparent; transition: background 160ms ease; }
      .jump:hover { color: var(--ink); }
      .jump.on { color: var(--ink); }
      .jump.on::after { background: var(--clay-strong); }
      @media (max-width: 700px) { .jump { padding: 11px 15px; } .jump .jt { font-size: 0.92rem; } }

      /* ── one section per use case ── */
      .usecase { margin-top: clamp(36px, 6vh, 58px); scroll-margin-top: 68px; }
      .uc-head { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
        border-bottom: 1px solid var(--rule); padding-bottom: 12px; margin-bottom: 18px; }
      .uc-title { font-family: var(--serif); font-weight: 500; font-size: clamp(1.3rem, 2.4vw, 1.7rem);
        letter-spacing: -0.015em; margin: 0; }
      .uc-note { color: var(--ink-soft); font-size: 0.88rem; margin: 0; }

      .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
      @media (max-width: 940px) { .grid { grid-template-columns: 1fr 1fr; } }

      /* ── the card ── */
      .gc { position: relative; display: flex; flex-direction: column; text-decoration: none;
        border: 1px solid var(--rule); border-radius: 14px; background: var(--paper);
        overflow: hidden; color: var(--ink);
        transition: border-color 160ms ease, transform 160ms ease, box-shadow 160ms ease; }
      .gc:hover, .gc:focus-visible { border-color: var(--clay); transform: translateY(-3px);
        box-shadow: 0 14px 34px rgba(26, 25, 21, 0.13); }
      .gc:focus-visible { outline: 2px solid var(--clay-strong); outline-offset: 2px; }

      .grid-thumb { --preview-scale: 0.26; position: relative; display: block; width: 100%;
        aspect-ratio: 16 / 10; background: var(--rule-soft); overflow: hidden;
        border-bottom: 1px solid var(--rule-soft); }
      .grid-thumb::after { content: ""; position: absolute; inset: 0;
        background: linear-gradient(to bottom, transparent 62%, rgba(26, 25, 21, 0.05)); }

      .gc-body { display: flex; flex-direction: column; gap: 5px; padding: 13px 15px 14px; flex: 1; }
      .gc-kicker { font-family: var(--mono); font-size: 0.58rem; letter-spacing: 0.14em;
        text-transform: uppercase; color: var(--clay-strong); }
      .gc-title { font-family: var(--serif); font-weight: 500; font-size: 1.14rem;
        letter-spacing: -0.01em; margin: 0; transition: color 140ms ease; }
      .gc:hover .gc-title { color: var(--clay-strong); }
      .gc-desc { margin: 0; color: var(--ink-soft); font-size: 0.84rem; line-height: 1.45; }
      .gc-foot { display: flex; align-items: center; margin-top: auto; padding-top: 8px; min-height: 1.2em; }
      .gc-open { margin-left: auto; font-size: 0.8rem; font-weight: 500; color: var(--clay-strong);
        opacity: 0; transform: translateX(-4px); transition: opacity 160ms ease, transform 160ms ease; }
      .gc:hover .gc-open, .gc:focus-visible .gc-open { opacity: 1; transform: none; }

      .hint { text-align: center; font-family: var(--mono); font-size: 0.6rem; letter-spacing: 0.14em;
        text-transform: uppercase; color: var(--ink-faint); margin: clamp(30px, 5vh, 46px) 0 0; }

      @media (max-width: 700px) {
        .grid { grid-template-columns: 1fr 1fr; gap: 12px; }
        .gc-desc { display: none; }
      }
      @media (max-width: 460px) { .grid { grid-template-columns: 1fr; } .gc-desc { display: block; } }
      @media (prefers-reduced-motion: reduce) {
        html { scroll-behavior: auto; }
        .gc, .jump, .gc-open { transition: none; }
      }
    </style>
  </head>
  <body data-switcher="bottom">
    <div class="lab">
      <header class="head">
        <p class="eyebrow">The demo gallery</p>
        <h1>Four jobs. <em>Every demo in sight.</em></h1>
        <p class="sub">
          No reveals, no carousels — the whole range on one page, grouped by what
          you'd use it for. Each card is a live preview; click through to the real app.
        </p>
      </header>

      <nav class="jumps" id="jumps" aria-label="Use cases"></nav>

      <div id="sections"></div>

      <p class="hint">Every thumbnail is the live app · click any card to open it</p>
    </div>

    <script src="data.js"></script>
    <script src="switcher.js"></script>
    <script>
      (function () {
        "use strict";

        var byId = {};
        PROTO.DEMOS.forEach(function (d) { byId[d.id] = d; });

        // Demos that live in Parts 1–2 of the shell but belong in a complete
        // catalogue — described here with the same shape as PROTO.DEMOS.
        var EXTRA = {
          graph: { id: "graph", kicker: "Graph viewer", title: "Trace the logic",
            desc: "Follow any output back through the RuleSpec graph to the provision that produced it.",
            mode: "Map", geo: "—", badge: "traceable" },
          oracles: { id: "oracles", kicker: "Oracles", title: "Validate across the ecosystem",
            desc: "Independent engines cross-checked household by household — divergences in the open.",
            mode: "App", geo: "US", badge: "validated" },
          bills: { id: "bills", kicker: "Bills", title: "Track active legislation",
            desc: "Active bills tracked and encoded as they move, ready to score.",
            mode: "App", geo: "US", badge: "live feed" }
        };
        function demo(id) { return byId[id] || EXTRA[id]; }

        var USECASES = [
          { key: "gov", title: "Build government systems on the law",
            note: "Eligibility, casework, and intake running directly on encoded statute and regulation.",
            ids: ["workflow", "builder", "bills"] },
          { key: "ai", title: "Ground AI models in citable law",
            note: "Assistants and agents that answer from encoded rules — every answer cites back to the text.",
            ids: ["finbot", "guidance"] },
          { key: "products", title: "Power products on rules you don't rebuild",
            note: "Embed validated, shared engines instead of re-encoding the law inside your own product.",
            ids: ["regdemo", "oracles"] },
          { key: "policy", title: "Simulate policy on real rules",
            note: "Change a parameter or a bill and score the impact — single household to full population.",
            ids: ["snap", "microsim"] }
        ];

        function card(d) {
          return '<a class="gc" href="' + PROTO.DEST[d.id] + '" target="_blank" rel="noreferrer" data-demo="' + d.id + '">' +
            PROTO.preview(d.id, "grid-thumb") +
            '<span class="gc-body">' +
              '<span class="gc-kicker">' + d.kicker + '</span>' +
              '<h3 class="gc-title">' + d.title + '</h3>' +
              '<p class="gc-desc">' + d.desc + '</p>' +
              '<span class="gc-foot"><span class="gc-open">Open demo ↗</span></span>' +
            '</span></a>';
        }

        document.getElementById("jumps").innerHTML = USECASES.map(function (u, i) {
          return '<a class="jump" href="#uc-' + u.key + '" data-key="' + u.key + '">' +
            '<span class="jt">' + u.title + '</span></a>';
        }).join("");

        document.getElementById("sections").innerHTML = USECASES.map(function (u, i) {
          return '<section class="usecase" id="uc-' + u.key + '" aria-labelledby="uch-' + u.key + '">' +
            '<div class="uc-head">' +
            '<h2 class="uc-title" id="uch-' + u.key + '">' + u.title + '</h2>' +
            '<p class="uc-note">' + u.note + '</p></div>' +
            '<div class="grid">' + u.ids.map(function (id) { return card(demo(id)); }).join("") + '</div>' +
            '</section>';
        }).join("");

        // scrollspy — underline the job you're currently reading
        var jumpsByKey = {};
        document.querySelectorAll(".jump").forEach(function (j) { jumpsByKey[j.dataset.key] = j; });
        var spy = new IntersectionObserver(function (entries) {
          entries.forEach(function (en) {
            if (!en.isIntersecting) return;
            var key = en.target.id.replace("uc-", "");
            Object.keys(jumpsByKey).forEach(function (k) {
              jumpsByKey[k].classList.toggle("on", k === key);
            });
          });
        }, { rootMargin: "-25% 0px -55% 0px" });
        document.querySelectorAll(".usecase").forEach(function (s) { spy.observe(s); });

        document.getElementById("sections").addEventListener("click", function (e) {
          var a = e.target.closest ? e.target.closest("a.gc") : null;
          if (a && window.gtag) window.gtag("event", "grid_open", { demo: a.dataset.demo, tool_name: "axiom-demo-shell" });
        });
      })();
    </script>
  </body>
</html>
