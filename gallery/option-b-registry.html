<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Option B · Registry panel — Axiom Demos</title>
    <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../styles.css" />
    <style>
      /* ---- Option B: registry / instrument panel ---- */
      .proto-tag {
        position: fixed; top: 10px; right: 12px; z-index: 20;
        font-family: var(--mono); font-size: 0.6rem; letter-spacing: 0.12em;
        text-transform: uppercase; color: var(--ink-faint);
        background: var(--paper); border: 1px solid var(--rule);
        border-radius: 999px; padding: 4px 10px;
      }
      /* stat strip — the catalog headline evaluators want up front */
      .statstrip {
        display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 18px;
        padding: 10px 14px; margin: 0 0 12px;
        border: 1px solid var(--rule); border-radius: 10px;
        background: var(--paper);
        font-family: var(--mono); font-size: 0.7rem; color: var(--ink-soft);
      }
      .statstrip .n { color: var(--ink); font-weight: 600; }
      .statstrip .ok { color: var(--ga); font-weight: 700; }

      .filters { display: flex; flex-wrap: wrap; gap: 7px; margin: 0 0 12px; }
      .fbtn {
        font-family: var(--mono); font-size: 0.62rem; letter-spacing: 0.06em;
        text-transform: uppercase; color: var(--ink-soft);
        padding: 5px 11px; border: 1px solid var(--rule); border-radius: 999px;
        background: var(--paper); cursor: pointer;
        transition: border-color 140ms ease, color 140ms ease, background 140ms ease;
      }
      .fbtn:hover { border-color: var(--clay); color: var(--clay-strong); }
      .fbtn[aria-pressed="true"] {
        background: var(--ink); color: var(--cloud); border-color: var(--ink);
      }

      .registry {
        border: 1px solid var(--rule); border-radius: 10px; overflow: hidden;
        background: var(--paper);
      }
      .rrow {
        display: grid;
        grid-template-columns: 92px 1.6fr 88px 96px 1fr;
        align-items: center; gap: 14px;
        padding: 9px 14px 9px 9px;
        border-top: 1px solid var(--rule-soft);
        text-decoration: none; color: inherit;
        transition: background 140ms ease;
      }
      .rrow:first-child { border-top: none; }
      .rrow:hover { background: color-mix(in srgb, var(--clay) 6%, var(--paper)); }

      .rthumb {
        position: relative; height: 52px; overflow: hidden;
        border-radius: 6px; border: 1px solid var(--rule-soft);
        background: var(--rule-soft);
      }
      .rthumb iframe { --preview-scale: 0.16; }
      .preview-builder iframe { --preview-scale: 0.12; }

      .rname { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
      .rname .k {
        font-family: var(--mono); font-size: 0.55rem; letter-spacing: 0.1em;
        text-transform: uppercase; color: var(--clay-strong);
      }
      .rname .t {
        font-family: var(--serif); font-size: 1rem; font-weight: 500;
        line-height: 1.1; color: var(--ink);
      }
      .rmode, .rgeo {
        font-family: var(--mono); font-size: 0.62rem; letter-spacing: 0.04em;
        color: var(--ink-soft);
      }
      .rmode span {
        display: inline-block; padding: 2px 7px; border-radius: 5px;
        background: color-mix(in srgb, var(--ink) 6%, transparent);
        border: 1px solid var(--rule);
      }
      .rstatus {
        display: inline-flex; align-items: center; gap: 6px;
        font-family: var(--mono); font-size: 0.58rem; letter-spacing: 0.06em;
        text-transform: uppercase; color: var(--ink-soft);
      }
      .rstatus .d { width: 7px; height: 7px; border-radius: 50%; flex: none; background: var(--ga);
        box-shadow: 0 0 0 2.5px color-mix(in srgb, var(--ga) 18%, transparent); }
      .rstatus.browser .d { background: var(--preview);
        box-shadow: 0 0 0 2.5px color-mix(in srgb, var(--preview) 18%, transparent); }
      .rstatus b { color: var(--ga); }
      .rdesc { font-size: 0.78rem; line-height: 1.35; color: var(--ink-soft); }

      .rrow.hidden { display: none; }

      @media (max-width: 820px) {
        .rrow { grid-template-columns: 72px 1.4fr 84px; }
        .rgeo, .rdesc { display: none; }
      }
      @media (max-width: 560px) {
        .rrow { grid-template-columns: 60px 1fr; }
        .rmode { display: none; }
      }
    </style>
  </head>
  <body>
    <span class="proto-tag">Option B · Registry panel</span>
    <header class="nav">
      <a class="wordmark" href="#" aria-label="Axiom demo home">
        <img src="../logos/axiom-foundation.svg" alt="Axiom Foundation" />
      </a>
    </header>

    <main class="page">
      <section class="hero" aria-labelledby="hero-title">
        <h1 id="hero-title">Computable law for&nbsp;all</h1>
        <p class="lede">From source law, through validation, into the demo gallery.</p>
      </section>

      <div class="journey">
        <div id="chapters"></div>

        <section class="chapter chapter--gallery" aria-labelledby="ch-3">
          <div class="ch-rail">
            <div class="ch-marker" aria-hidden="true"><span>03</span></div>
            <div>
              <h2 class="ch-title" id="ch-3">Then the law becomes usable</h2>
              <p class="ch-story">The demo gallery — one verified substrate, many products.</p>
              <p class="ch-status"><span class="dot demos"></span>demos</p>
            </div>
          </div>
          <div>
            <div class="statstrip">
              <span><span class="n">59</span> programs indexed</span>
              <span><span class="n">16</span> compiled packages</span>
              <span>CO SNAP golden path <span class="ok">● 0 mismatches</span></span>
            </div>
            <div class="filters" id="filters">
              <button class="fbtn" data-f="all" aria-pressed="true">All</button>
              <button class="fbtn" data-f="validated" aria-pressed="false">Validated</button>
              <button class="fbtn" data-f="browser" aria-pressed="false">Runs in-browser</button>
              <button class="fbtn" data-f="us" aria-pressed="false">US</button>
              <button class="fbtn" data-f="uk" aria-pressed="false">UK</button>
            </div>
            <div class="registry" id="registry"></div>
          </div>
        </section>
      </div>
    </main>

    <script src="data.js"></script>
    <script>
      (function () {
        PROTO.renderChapters(document.getElementById("chapters"));

        var rows = PROTO.DEMOS.map(function (d) {
          var validated = /validated/.test(d.badge || "");
          var status = validated
            ? '<span class="rstatus"><span class="d"></span><b>0×</b></span>'
            : d.inBrowser
              ? '<span class="rstatus browser"><span class="d"></span>wasm</span>'
              : '<span class="rstatus"><span class="d"></span>live</span>';
          return '<a class="rrow" href="' + PROTO.DEST[d.id] + '" target="_blank" rel="noreferrer"' +
            ' data-geo="' + d.geo.toLowerCase() + '"' +
            ' data-validated="' + validated + '" data-browser="' + !!d.inBrowser + '">' +
            PROTO.preview(d.id, "rthumb") +
            '<span class="rname"><span class="k">' + d.kicker + '</span>' +
            '<span class="t">' + d.title + '</span></span>' +
            '<span class="rmode"><span>' + d.mode + '</span></span>' +
            '<span class="rgeo">' + d.geo + '</span>' +
            status +
            '<span class="rdesc">' + d.desc + '</span>' +
            '</a>';
        }).join("");
        var registry = document.getElementById("registry");
        registry.innerHTML = rows;

        // functional filters — the "dynamic" made visible
        var buttons = Array.prototype.slice.call(document.querySelectorAll(".fbtn"));
        buttons.forEach(function (btn) {
          btn.addEventListener("click", function () {
            buttons.forEach(function (b) { b.setAttribute("aria-pressed", "false"); });
            btn.setAttribute("aria-pressed", "true");
            var f = btn.dataset.f;
            Array.prototype.slice.call(registry.children).forEach(function (row) {
              var show = f === "all" ||
                (f === "validated" && row.dataset.validated === "true") ||
                (f === "browser" && row.dataset.browser === "true") ||
                (f === "us" && row.dataset.geo.indexOf("us") > -1) ||
                (f === "uk" && row.dataset.geo.indexOf("uk") > -1);
              row.classList.toggle("hidden", !show);
            });
          });
        });
      })();
    </script>
  </body>
</html>
